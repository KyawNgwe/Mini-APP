<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>饮料菜单点餐系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .menu-item {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
        }

        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .menu-item.selected {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .menu-item .icon {
            font-size: 3em;
            margin-bottom: 10px;
            display: block;
        }

        .menu-item .name {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .menu-item .price {
            color: #667eea;
            font-weight: bold;
            font-size: 1.2em;
        }

        .menu-item .badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            font-weight: bold;
        }

        .order-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .order-header h2 {
            color: #333;
            font-size: 1.3em;
        }

        .order-header .total {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }

        .order-list {
            list-style: none;
            padding: 0;
            margin-bottom: 15px;
        }

        .order-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: white;
            margin-bottom: 8px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .order-list .item-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .order-list .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .order-list .quantity-controls button {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 1.2em;
            transition: background 0.3s;
        }

        .order-list .quantity-controls button:hover {
            background: #5a67d8;
        }

        .order-list .quantity-controls .qty {
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        .order-list .remove-btn {
            background: #e53e3e;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }

        .order-list .remove-btn:hover {
            background: #c53030;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            transform: scale(1.02);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.5s ease;
            max-width: 350px;
        }

        .notification.success {
            background: #48bb78;
        }

        .notification.error {
            background: #e53e3e;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .telegram-config {
            background: #edf2f7;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .telegram-config label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .telegram-config input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 1em;
        }

        .telegram-config .hint {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            .menu-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧋 饮料菜单</h1>
        <p class="subtitle">点击选择您喜欢的饮品</p>

        <!-- Telegram 配置 -->
      
            <input type="password" id="botToken" placeholder="输入你的 Bot Token" value="8939398684:AAER1E5i3hsp_Ltt6o0IBYqYLuc6VKU-dxo">
            <input type="text" id="chatId" placeholder="输入你的 Chat ID" value="1949334561">
        
               
            </div>
        </div>

        <!-- 菜单 -->
        <div class="menu-grid" id="menuGrid">
            <!-- 由 JavaScript 动态生成 -->
        </div>
<!-- 客人信息 -->
<div class="customer-info">
    <div class="info-row">
        <div class="info-group">
            <label>👤 姓名</label>
            <input type="text" id="customerName" placeholder="请输入您的姓名">
        </div>
        <div class="info-group">
            <label>📋 桌号</label>
            <input type="text" id="tableNumber" placeholder="请输入桌号">
        </div>
    </div>
    <div class="info-group">
        <label>📍 地址</label>
        <input type="text" id="customerAddress" placeholder="请输入送餐地址">
    </div>
</div>
        <!-- 订单区域 -->
        <div class="order-section">
            <div class="order-header">
                <h2>🛒 当前订单</h2>
                <span class="total">总计: ฿<span id="totalPrice">0</span></span>
            </div>
            <ul class="order-list" id="orderList">
                <li style="text-align: center; color: #999; padding: 20px;">还没有点餐，快来选择吧！</li>
            </ul>
            <button class="btn-primary" id="sendOrderBtn" disabled>
                📤 发送订单到 Telegram
            </button>
        </div>
    </div>

    <script>
        // ========== 饮料菜单数据 ==========
        const menuData = [{
            id: 1,
            name: '泰式奶茶',
            icon: '🧋',
            price: 45
        }, {
            id: 2,
            name: '柠檬红茶',
            icon: '🍋',
            price: 35
        }, {
            id: 3,
            name: '抹茶拿铁',
            icon: '🍵',
            price: 55
        }, {
            id: 4,
            name: '芒果沙冰',
            icon: '🥭',
            price: 60
        }, {
            id: 5,
            name: '椰子水',
            icon: '🥥',
            price: 40
        }, {
            id: 6,
            name: '百香果茶',
            icon: '🍹',
            price: 50
        }, {
            id: 7,
            name: '巧克力冰沙',
            icon: '🍫',
            price: 55
        }, {
            id: 8,
            name: '草莓奶昔',
            icon: '🍓',
            price: 65
        }];

        // ========== 状态管理 ==========
        let order = {}; // { itemId: quantity }

        // ========== DOM 引用 ==========
        const menuGrid = document.getElementById('menuGrid');
        const orderList = document.getElementById('orderList');
        const totalPriceEl = document.getElementById('totalPrice');
        const sendBtn = document.getElementById('sendOrderBtn');
        const botTokenInput = document.getElementById('botToken');
        const chatIdInput = document.getElementById('chatId');

        // ========== 渲染菜单 ==========
        function renderMenu() {
            menuGrid.innerHTML = '';
            menuData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'menu-item';
                div.innerHTML = `
                    <span class="icon">${item.icon}</span>
                    <div class="name">${item.name}</div>
                    <div class="price">฿${item.price}</div>
                    ${order[item.id] ? `<div class="badge">${order[item.id]}</div>` : ''}
                `;
                div.addEventListener('click', () => addToOrder(item.id));
                menuGrid.appendChild(div);
            });
        }

        // ========== 添加到订单 ==========
        function addToOrder(itemId) {
            if (order[itemId]) {
                order[itemId]++;
            } else {
                order[itemId] = 1;
            }
            updateUI();
        }

        // ========== 更新数量 ==========
        function updateQuantity(itemId, delta) {
            const newQty = (order[itemId] || 0) + delta;
            if (newQty <= 0) {
                delete order[itemId];
            } else {
                order[itemId] = newQty;
            }
            updateUI();
        }

        // ========== 移除项目 ==========
        function removeItem(itemId) {
            delete order[itemId];
            updateUI();
        }

        // ========== 更新 UI ==========
        function updateUI() {
            // 更新菜单
            renderMenu();

            // 更新订单列表
            const items = Object.keys(order);
            if (items.length === 0) {
                orderList.innerHTML =
                    `<li style="text-align: center; color: #999; padding: 20px;">还没有点餐，快来选择吧！</li>`;
                totalPriceEl.textContent = '0';
                sendBtn.disabled = true;
                return;
            }

            let total = 0;
            let html = '';
            items.forEach(id => {
                const item = menuData.find(m => m.id === parseInt(id));
                const qty = order[id];
                const subtotal = item.price * qty;
                total += subtotal;
                html += `
                    <li>
                        <div class="item-info">
                            <span>${item.icon}</span>
                            <span>${item.name}</span>
                            <span style="color:#667eea;font-weight:bold;">฿${item.price}</span>
                        </div>
                        <div class="quantity-controls">
                            <button onclick="updateQuantity(${id}, -1)">−</button>
                            <span class="qty">${qty}</span>
                            <button onclick="updateQuantity(${id}, 1)">+</button>
                            <button class="remove-btn" onclick="removeItem(${id})">✕</button>
                        </div>
                    </li>
                `;
            });

            orderList.innerHTML = html;
            totalPriceEl.textContent = total;
            sendBtn.disabled = false;
        }

        // ========== 发送订单到 Telegram ==========
        async function sendOrderToTelegram() {
            const botToken = botTokenInput.value.trim();
            const chatId = chatIdInput.value.trim();

            if (!botToken || !chatId) {
                showNotification('⚠️ 请先配置 Bot Token 和 Chat ID', 'error');
                return;
            }

            if (Object.keys(order).length === 0) {
                showNotification('⚠️ 订单为空，请先点餐！', 'error');
                return;
            }

            // 构造订单消息
            let message = '🧋 *新订单*\n\n';
            let total = 0;
            let items = [];

            Object.keys(order).forEach(id => {
                const item = menuData.find(m => m.id === parseInt(id));
                const qty = order[id];
                const subtotal = item.price * qty;
                total += subtotal;
                items.push(`${item.icon} ${item.name} x${qty} = ฿${subtotal}`);
            });

            message += items.join('\n');
            message += `\n\n💰 *总计: ฿${total}*`;
            message += `\n🕐 ${new Date().toLocaleString('zh-CN')}`;

            // 发送到 Telegram
            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

            try {
                sendBtn.disabled = true;
                sendBtn.textContent = '⏳ 发送中...';

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    showNotification('✅ 订单已成功发送到 Telegram！', 'success');
                    // 清空订单
                    order = {};
                    updateUI();
                } else {
                    showNotification(`❌ 发送失败: ${data.description || '未知错误'}`, 'error');
                }
            } catch (error) {
                showNotification(`❌ 网络错误: ${error.message}`, 'error');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '📤 发送订单到 Telegram';
            }
        }

        // ========== 通知系统 ==========
        function showNotification(message, type = 'success') {
            // 移除旧通知
            const old = document.querySelector('.notification');
            if (old) old.remove();

            const div = document.createElement('div');
            div.className = `notification ${type}`;
            div.textContent = message;
            document.body.appendChild(div);

            setTimeout(() => {
                div.style.opacity = '0';
                div.style.transition = 'opacity 0.5s';
                setTimeout(() => div.remove(), 500);
            }, 4000);
        }

        // ========== 保存配置到 localStorage ==========
        function saveConfig() {
            localStorage.setItem('botToken', botTokenInput.value);
            localStorage.setItem('chatId', chatIdInput.value);
        }

        function loadConfig() {
            const token = localStorage.getItem('botToken');
            const chatId = localStorage.getItem('chatId');
            if (token) botTokenInput.value = token;
            if (chatId) chatIdInput.value = chatId;
        }

        // ========== 事件绑定 ==========
        sendBtn.addEventListener('click', sendOrderToTelegram);

        botTokenInput.addEventListener('change', saveConfig);
        chatIdInput.addEventListener('change', saveConfig);

        // ========== 初始化 ==========
        loadConfig();
        renderMenu();
        updateUI();
    </script>
</body>
</html>
