<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>点餐 - 老板私房菜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f7f3ee;
            padding: 20px 16px 40px;
            min-height: 100vh;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 26px;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }
        .sub-title {
            text-align: center;
            color: #95a5a6;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .card:active {
            transform: scale(0.98);
            background: #fefcf9;
        }
        .info h3 {
            font-size: 17px;
            color: #2c3e50;
            font-weight: 600;
        }
        .info p {
            color: #e67e22;
            font-size: 15px;
            font-weight: 500;
            margin-top: 2px;
        }
        .qty {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #f8f5f2;
            padding: 4px 6px;
            border-radius: 30px;
        }
        .qty button {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: #e67e22;
            color: white;
            font-size: 20px;
            font-weight: 300;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .qty button:active {
            background: #d35400;
            transform: scale(0.92);
        }
        .qty span {
            font-size: 18px;
            font-weight: 600;
            min-width: 28px;
            text-align: center;
            color: #2c3e50;
        }
        .total-box {
            background: #2c3e50;
            color: white;
            padding: 16px 20px;
            border-radius: 16px;
            margin: 20px 0 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .total-box label {
            font-size: 16px;
            opacity: 0.8;
        }
        .total-box span {
            font-size: 28px;
            font-weight: 700;
            color: #f1c40f;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e0d8d2;
            border-radius: 12px;
            font-size: 16px;
            background: white;
            transition: 0.2s;
            outline: none;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #e67e22;
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.15);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
            letter-spacing: 2px;
            box-shadow: 0 4px 14px rgba(230, 126, 34, 0.35);
        }
        .btn-submit:active {
            transform: scale(0.96);
            background: #d35400;
        }
        #status {
            text-align: center;
            margin-top: 16px;
            font-size: 15px;
            font-weight: 500;
            min-height: 24px;
            color: #27ae60;
        }
        #status.error {
            color: #e74c3c;
        }
        .clear-btn {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 10px;
        }
        .clear-btn button {
            background: none;
            border: none;
            color: #95a5a6;
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍜 老板私房菜</h1>
    <p class="sub-title">✨ 点餐后老板将立即收到通知</p>

    <!-- 菜品列表由 JS 动态渲染 -->
    <div id="menu"></div>

    <!-- 合计 -->
    <div class="total-box">
        <label>💰 合计</label>
        <span id="totalPrice">0</span>
    </div>

    <!-- 顾客信息 -->
    <div class="form-group">
        <input id="customer" placeholder="👤 您的称呼（必填）" />
    </div>
    <div class="form-group">
        <input id="phone" placeholder="📞 手机号（选填，方便联系）" />
    </div>
    <div class="form-group">
        <textarea id="address" placeholder="📍 送餐地址（选填，自取可留空）" rows="2"></textarea>
    </div>

    <button class="btn-submit" onclick="submitOrder()">✅ 立即下单</button>
    <div id="status"></div>
</div>

<script>
    // ======= 从后端注入菜单数据 =======
    const menu = {{ menu|tojson }};
    // ================================

    // 购物车对象 { 菜品id: 数量 }
    const cart = {};

    // 渲染菜单和总价
    function render() {
        let html = '';
        menu.forEach(item => {
            const qty = cart[item.id] || 0;
            html += `
                <div class="card">
                    <div class="info">
                        <h3>${item.name}</h3>
                        <p>¥${item.price}</p>
                    </div>
                    <div class="qty">
                        <button onclick="changeQty(${item.id}, -1)">−</button>
                        <span>${qty}</span>
                        <button onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                </div>
            `;
        });
        document.getElementById('menu').innerHTML = html;

        // 计算总价
        let total = 0;
        for (let id in cart) {
            const item = menu.find(m => m.id == id);
            if (item) total += cart[id] * item.price;
        }
        document.getElementById('totalPrice').innerText = total;
    }

    // 修改数量
    function changeQty(id, delta) {
        if (!cart[id]) cart[id] = 0;
        const newQty = cart[id] + delta;
        if (newQty <= 0) {
            delete cart[id];
        } else {
            cart[id] = newQty;
        }
        render();
    }

    // 提交订单
    async function submitOrder() {
        const items = Object.keys(cart).map(id => {
            const item = menu.find(m => m.id == id);
            return { id, name: item.name, price: item.price, quantity: cart[id] };
        });

        if (items.length === 0) {
            alert('🥺 请至少选一道菜再下单哦！');
            return;
        }

        const customer = document.getElementById('customer').value.trim();
        if (!customer) {
            alert('👤 请留下您的称呼，方便老板联系您～');
            document.getElementById('customer').focus();
            return;
        }

        const payload = {
            customer: customer,
            phone: document.getElementById('phone').value.trim() || '未填写',
            address: document.getElementById('address').value.trim() || '自取',
            items: items
        };

        const statusEl = document.getElementById('status');
        statusEl.className = '';
        statusEl.innerText = '⏳ 订单提交中，请稍候...';

        try {
            const res = await fetch('/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();

            if (result.status === 'success') {
                statusEl.className = '';
                statusEl.innerText = '✅ 下单成功！老板已收到通知，稍后联系您～';
                // 清空购物车和信息（地址和手机保留方便连续点单）
                for (let id in cart) delete cart[id];
                render();
                document.getElementById('customer').value = '';
                // 可选清空手机和地址，看喜好，这里保留方便老顾客
                // document.getElementById('phone').value = '';
                // document.getElementById('address').value = '';
            } else {
                statusEl.className = 'error';
                statusEl.innerText = '❌ 下单失败，请重试 (错误: ' + (result.msg || '网络异常') + ')';
            }
        } catch (e) {
            statusEl.className = 'error';
            statusEl.innerText = '❌ 网络连接失败，请检查网络后重试';
            console.error(e);
        }
    }

    // 初始化渲染
    render();
</script>

</body>
</html
