<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>茶饮菜单</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');

  :root{
    --cream:#FAF5EC;
    --paper:#FFFFFF;
    --brown-900:#2B211B;
    --brown-700:#5A4636;
    --brown-400:#9C8570;
    --brown-200:#E4D8C7;
    --amber:#B8722E;
    --amber-dark:#8A5420;
    --matcha:#6B7F52;
    --matcha-dark:#4C5B3A;
    --red:#B4453A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--brown-900);
    font-family:'Noto Sans SC', sans-serif;
    padding-bottom:90px;
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 16px;}

  header{
    padding:28px 16px 18px;
    background:var(--cream);
    position:relative;
    text-align:center;
  }
  .gear{
    position:absolute;
    top:24px;right:16px;
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid var(--brown-200);
    background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:18px;
    color:var(--brown-700);
  }
  .gear:active{transform:scale(0.95);}
  h1{
    font-family:'Noto Serif SC', serif;
    font-weight:700;
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:1px;
  }
  .tagline{
    color:var(--brown-400);
    font-size:13px;
    letter-spacing:2px;
  }
  .divider{
    width:36px;height:3px;background:var(--amber);
    margin:14px auto 0;border-radius:2px;
  }

  .section-title{
    font-family:'Noto Serif SC', serif;
    font-size:15px;
    font-weight:700;
    color:var(--amber-dark);
    margin:22px 0 10px;
    display:flex;align-items:center;gap:8px;
  }
  .section-title::after{
    content:'';flex:1;height:1px;background:var(--brown-200);
  }

  .card{
    background:var(--paper);
    border:1px solid var(--brown-200);
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;
    display:flex;
    gap:12px;
    align-items:center;
  }
  .card-icon{
    width:46px;height:46px;border-radius:50%;
    background:var(--brown-200);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0;
  }
  .card-info{flex:1;min-width:0;}
  .card-name{font-size:15px;font-weight:500;margin:0 0 2px;}
  .card-desc{font-size:12px;color:var(--brown-400);margin:0 0 6px;line-height:1.4;}
  .card-price{font-size:14px;color:var(--amber-dark);font-weight:700;}

  .stepper{
    display:flex;align-items:center;gap:10px;flex-shrink:0;
  }
  .stepper button{
    width:28px;height:28px;border-radius:50%;
    border:1px solid var(--brown-200);
    background:var(--cream);
    font-size:16px;color:var(--brown-700);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;
  }
  .stepper button:active{transform:scale(0.9);}
  .stepper span{min-width:16px;text-align:center;font-size:14px;font-weight:500;}

  /* cart bar */
  .cartbar{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--brown-900);
    color:#fff;
    padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;
    max-width:480px;margin:0 auto;
    border-radius:16px 16px 0 0;
    box-shadow:0 -4px 16px rgba(0,0,0,0.12);
    transform:translateY(120%);
    transition:transform 0.25s ease;
    z-index:20;
  }
  .cartbar.show{transform:translateY(0);}
  .cartbar .left{font-size:13px;color:#E4D8C7;}
  .cartbar .total{font-size:18px;font-weight:700;color:#fff;}
  .cartbar button{
    background:var(--amber);
    color:#fff;border:none;border-radius:10px;
    padding:10px 18px;font-size:14px;font-weight:500;
    cursor:pointer;
  }

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(43,33,27,0.45);
    display:none;align-items:flex-end;justify-content:center;z-index:30;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--paper);
    width:100%;max-width:480px;
    border-radius:20px 20px 0 0;
    padding:20px 20px 24px;
    max-height:85vh;overflow-y:auto;
  }
  .sheet h2{
    font-family:'Noto Serif SC', serif;
    font-size:18px;margin:0 0 14px;
  }
  .sheet .close{
    float:right;font-size:20px;color:var(--brown-400);
    cursor:pointer;line-height:1;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:12px;color:var(--brown-400);margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%;padding:10px 12px;
    border:1px solid var(--brown-200);border-radius:10px;
    font-size:14px;font-family:inherit;
    background:var(--cream);color:var(--brown-900);
  }
  .field textarea{resize:vertical;min-height:60px;}
  .hint{font-size:11px;color:var(--brown-400);margin-top:6px;line-height:1.5;}
  .hint a{color:var(--amber-dark);}

  .masked-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;background:var(--cream);
    border:1px solid var(--brown-200);border-radius:10px;
    font-size:14px;
  }
  .masked-row .dots{letter-spacing:2px;color:var(--brown-400);}
  .masked-row .status{color:var(--matcha-dark);font-size:12px;}
  .link-btn{
    background:none;border:none;color:var(--amber-dark);
    font-size:13px;cursor:pointer;text-decoration:underline;padding:0;
  }

  .primary-btn{
    width:100%;padding:13px;border:none;border-radius:12px;
    background:var(--amber);color:#fff;font-size:15px;font-weight:500;
    cursor:pointer;margin-top:6px;
  }
  .primary-btn:disabled{background:var(--brown-200);color:var(--brown-400);}
  .primary-btn:active{transform:scale(0.98);}

  .ghost-btn{
    width:100%;padding:11px;border:1px solid var(--brown-200);border-radius:12px;
    background:none;color:var(--brown-700);font-size:14px;
    cursor:pointer;margin-top:8px;
  }

  .order-line{
    display:flex;justify-content:space-between;font-size:13px;
    padding:6px 0;border-bottom:1px dashed var(--brown-200);
  }
  .order-total{
    display:flex;justify-content:space-between;font-size:15px;font-weight:700;
    padding-top:10px;margin-top:4px;
  }

  .toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);
    background:var(--brown-900);color:#fff;padding:10px 18px;
    border-radius:10px;font-size:13px;z-index:50;
    opacity:0;pointer-events:none;transition:opacity 0.2s;
  }
  .toast.show{opacity:1;}
  .toast.error{background:var(--red);}
  .toast.ok{background:var(--matcha-dark);}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="gear" id="gearBtn" title="设置">⚙</div>
    <h1>茶 香 屋</h1>
    <div class="tagline">CHÁ XIĀNG WŪ · 手作茶饮</div>
    <div class="divider"></div>
  </header>

  <div id="menu"></div>
</div>

<div class="cartbar" id="cartbar">
  <div>
    <div class="left" id="cartCount">已选 0 件</div>
    <div class="total" id="cartTotal">¥0</div>
  </div>
  <button id="goCheckout">去下单</button>
</div>

<!-- Settings modal -->
<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <span class="close" id="closeSettings">×</span>
    <h2>Telegram 通知设置</h2>
    <p class="hint">下单后订单会通过 Telegram 机器人发送给你。信息保存在你本机浏览器中，页面上只会显示是否已设置，不会显示具体内容。</p>

    <div class="field" id="tokenField"></div>
    <div class="field" id="chatIdField"></div>

    <button class="primary-btn" id="saveSettings">保存设置</button>
    <p class="hint">还没有机器人？在 Telegram 搜索 <b>@BotFather</b> 发送 /newbot 创建，再给 <b>@userinfobot</b> 发消息获取你的 Chat ID。</p>
  </div>
</div>

<!-- Checkout modal -->
<div class="overlay" id="checkoutOverlay">
  <div class="sheet">
    <span class="close" id="closeCheckout">×</span>
    <h2>确认订单</h2>
    <div id="orderLines"></div>
    <div class="order-total"><span>合计</span><span id="orderTotal">¥0</span></div>

    <div class="field" style="margin-top:16px;">
      <label>称呼</label>
      <input type="text" id="custName" placeholder="怎么称呼你">
      <p class="hint" id="nameError" style="display:none;color:var(--red);">请填写称呼后再下单</p>
    </div>
    <div class="field">
      <label>手机号</label>
      <input type="tel" id="custPhone" placeholder="方便联系你取餐">
      <p class="hint" id="phoneError" style="display:none;color:var(--red);">请填写手机号后再下单</p>
    </div>
    <div class="field">
      <label>备注（选填）</label>
      <textarea id="custNote" placeholder="少冰 / 不要糖 / 取餐时间 等"></textarea>
    </div>

    <button class="primary-btn" id="sendOrder">发送订单</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DRINKS = [
  {id:'d1', icon:'🧋', img:'', name:'珍珠奶茶', desc:'经典手打黑糖珍珠', price:9500},
  {id:'d2', icon:'🍑', img:'', name:'白桃乌龙', desc:'冷萃乌龙 · 鲜桃果肉', price:9500},
  {id:'d3', icon:'🍵', img:'', name:'抹茶拿铁', desc:'京都抹茶 · 鲜牛乳', price:9500},
  {id:'d4', icon:'🍊', img:'', name:'四季春茶', desc:'原叶冷泡 · 无糖可选', price:9000},
  {id:'d5', icon:'🍓', img:'', name:'草莓芝士', desc:'新鲜草莓 · 芝士奶盖', price:10000},
  {id:'d6', icon:'🥭', img:'', name:'芒果椰椰', desc:'芒果果泥 · 椰浆基底', price:9500},
  {id:'d7', icon:'', img:'', name:'西瓜椰耶', desc:'西瓜果泥 · 椰浆基底', price:9500},
];

let cart = {}; // id -> qty

function renderMenu(){
  const menu = document.getElementById('menu');
  menu.innerHTML = '<div class="section-title">全部饮品</div>';
  DRINKS.forEach(d=>{
    const qty = cart[d.id] || 0;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-icon">${d.img ? `<img src="${d.img}" alt="${d.name}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : d.icon}</div>
      <div class="card-info">
        <p class="card-name">${d.name}</p>
        <p class="card-desc">${d.desc}</p>
        <p class="card-price">kyat${d.price}</p>
      </div>
      <div class="stepper">
        <button data-act="minus" data-id="${d.id}">−</button>
        <span id="qty-${d.id}">${qty}</span>
        <button data-act="plus" data-id="${d.id}">+</button>
      </div>
    `;
    menu.appendChild(card);
  });
  menu.querySelectorAll('button[data-act]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      const cur = cart[id] || 0;
      const next = act === 'plus' ? cur + 1 : Math.max(0, cur - 1);
      if(next === 0) delete cart[id]; else cart[id] = next;
      document.getElementById(`qty-${id}`).textContent = next;
      updateCartBar();
    });
  });
}

function cartItems(){
  return Object.entries(cart).map(([id, qty])=>{
    const d = DRINKS.find(x=>x.id===id);
    return {...d, qty, subtotal: d.price*qty};
  });
}

function updateCartBar(){
  const items = cartItems();
  const count = items.reduce((s,i)=>s+i.qty,0);
  const total = items.reduce((s,i)=>s+i.subtotal,0);
  document.getElementById('cartCount').textContent = `已选 ${count} 件`;
  document.getElementById('cartTotal').textContent = `kyat${total}`;
  document.getElementById('cartbar').classList.toggle('show', count > 0);
}

function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(()=>{ t.className = 'toast'; }, 2600);
}

/* ---------- Settings (Telegram token / chat id), masked in UI ---------- */
let settings = { token:'8939398684:AAGmsjumYDRjiARlGGVkDscjWybnxzy272Q', chatId:'1949334561' };

function fieldHTML(label, id, placeholder){
  return `<label>${label}</label><input type="password" id="${id}" placeholder="${placeholder}" autocomplete="off">`;
}

function renderSettingsFields(){
  const tokenField = document.getElementById('tokenField');
  const chatField = document.getElementById('chatIdField');

  if(settings.token){
    tokenField.innerHTML = `
      <label>机器人 Token</label>
      <div class="masked-row">
        <span class="dots">•••••••••••••••</span>
        <span class="status">已设置 ✓</span>
      </div>
      <button class="link-btn" id="changeToken" style="margin-top:6px;">更改</button>
    `;
    document.getElementById('changeToken').addEventListener('click', ()=>{
      tokenField.innerHTML = fieldHTML('机器人 Token', 'tokenInput', '输入新的 Bot Token');
    });
  } else {
    tokenField.innerHTML = fieldHTML('机器人 Token', 'tokenInput', '从 @BotFather 获取');
  }

  if(settings.chatId){
    chatField.innerHTML = `
      <label>Chat ID</label>
      <div class="masked-row">
        <span class="dots">•••••••••</span>
        <span class="status">已设置 ✓</span>
      </div>
      <button class="link-btn" id="changeChatId" style="margin-top:6px;">更改</button>
    `;
    document.getElementById('changeChatId').addEventListener('click', ()=>{
      chatField.innerHTML = fieldHTML('Chat ID', 'chatIdInput', '输入新的 Chat ID');
    });
  } else {
    chatField.innerHTML = fieldHTML('Chat ID', 'chatIdInput', '从 @userinfobot 获取');
  }
}

async function loadSettings(){
  try{
    const t = await window.storage.get('tg_token', false);
    const c = await window.storage.get('tg_chat_id', false);
    settings.token = t ? t.value : '';
    settings.chatId = c ? c.value : '';
  }catch(e){
    // no settings saved yet
  }
  renderSettingsFields();
}

document.getElementById('saveSettings').addEventListener('click', async ()=>{
  const tokenInput = document.getElementById('tokenInput');
  const chatIdInput = document.getElementById('chatIdInput');
  let changed = false;

  try{
    if(tokenInput && tokenInput.value.trim()){
      await window.storage.set('tg_token', tokenInput.value.trim(), false);
      settings.token = tokenInput.value.trim();
      changed = true;
    }
    if(chatIdInput && chatIdInput.value.trim()){
      await window.storage.set('tg_chat_id', chatIdInput.value.trim(), false);
      settings.chatId = chatIdInput.value.trim();
      changed = true;
    }
    renderSettingsFields();
    showToast(changed ? '设置已保存' : '没有改动', changed ? 'ok' : null);
  }catch(e){
    showToast('保存失败，请重试', 'error');
  }
});

/* ---------- modals ---------- */
document.getElementById('gearBtn').addEventListener('click', ()=>{
  document.getElementById('settingsOverlay').classList.add('show');
});
document.getElementById('closeSettings').addEventListener('click', ()=>{
  document.getElementById('settingsOverlay').classList.remove('show');
});

document.getElementById('goCheckout').addEventListener('click', ()=>{
  renderOrderReview();
  document.getElementById('checkoutOverlay').classList.add('show');
});
document.getElementById('closeCheckout').addEventListener('click', ()=>{
  document.getElementById('checkoutOverlay').classList.remove('show');
});

function renderOrderReview(){
  const items = cartItems();
  const total = items.reduce((s,i)=>s+i.subtotal,0);
  document.getElementById('orderLines').innerHTML = items.map(i=>
    `<div class="order-line"><span>${i.icon} ${i.name} ×${i.qty}</span><span>¥${i.subtotal}</span></div>`
  ).join('');
  document.getElementById('orderTotal').textContent = `¥${total}`;
}

document.getElementById('custName').addEventListener('input', ()=>{
  document.getElementById('nameError').style.display = 'none';
});
document.getElementById('custPhone').addEventListener('input', ()=>{
  document.getElementById('phoneError').style.display = 'none';
});

document.getElementById('sendOrder').addEventListener('click', async ()=>{
  const items = cartItems();
  if(items.length === 0){
    showToast('购物车是空的', 'error');
    return;
  }

  const nameInput = document.getElementById('custName');
  const nameError = document.getElementById('nameError');
  const phoneInput = document.getElementById('custPhone');
  const phoneError = document.getElementById('phoneError');

  let hasError = false;
  if(!nameInput.value.trim()){
    nameError.style.display = 'block';
    hasError = true;
  } else {
    nameError.style.display = 'none';
  }
  if(!phoneInput.value.trim()){
    phoneError.style.display = 'block';
    hasError = true;
  } else {
    phoneError.style.display = 'none';
  }
  if(hasError){
    (nameInput.value.trim() ? phoneInput : nameInput).focus();
    return;
  }

  if(!settings.token || !settings.chatId){
    showToast('请先在设置中填写 Telegram Token 和 Chat ID', 'error');
    document.getElementById('checkoutOverlay').classList.remove('show');
    document.getElementById('settingsOverlay').classList.add('show');
    return;
  }

  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const note = document.getElementById('custNote').value.trim();
  const total = items.reduce((s,i)=>s+i.subtotal,0);

  const lines = [
    '🧋 新订单',
    name ? `顾客：${name}` : null,
    phone ? `手机号：${phone}` : null,
    '——————————',
    ...items.map(i=>`${i.name} ×${i.qty}  ¥${i.subtotal}`),
    '——————————',
    `合计：¥${total}`,
    note ? `备注：${note}` : null,
  ].filter(Boolean).join('\n');

  const btn = document.getElementById('sendOrder');
  btn.disabled = true;
  btn.textContent = '发送中…';

  try{
    const res = await fetch(`https://api.telegram.org/bot${settings.token}/sendMessage`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ chat_id: settings.chatId, text: lines })
    });
    const data = await res.json();
    if(data.ok){
      showToast('订单已发送', 'ok');
      cart = {};
      renderMenu();
      updateCartBar();
      document.getElementById('checkoutOverlay').classList.remove('show');
      document.getElementById('custName').value = '';
      document.getElementById('custPhone').value = '';
      document.getElementById('custNote').value = '';
    } else {
      showToast('发送失败：' + (data.description || '请检查 Token / Chat ID'), 'error');
    }
  }catch(e){
    showToast('网络错误，发送失败', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '发送订单';
  }
});

renderMenu();
updateCartBar();
loadSettings();
</script>
</body>
</html>
