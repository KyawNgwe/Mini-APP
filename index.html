<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }
  #shell {
    min-height: 100vh;
    background: #16302B;
    font-family: 'Noto Sans SC', system-ui, sans-serif;
    color: #1F2A24;
    padding-bottom: 90px;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 0 18px; }
  .brand { font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 15px; letter-spacing: 0.08em; color: #F5EBD8; }
  .icon-btn-top {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(245,238,224,0.08); color: #C69A4B;
    border: 1px solid rgba(198,154,75,0.35); cursor: pointer;
  }
  .hero { padding: 18px 18px 26px 18px; text-align: center; }
  .hero-mark { display: flex; justify-content: center; margin-bottom: 6px; }
  .wisp { animation: rise 4s ease-in-out infinite; transform-origin: bottom center; }
  .wisp-a { animation-delay: 0s; }
  .wisp-b { animation-delay: 1.1s; }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(6px) scaleY(0.9); }
    35% { opacity: 0.9; }
    100% { opacity: 0; transform: translateY(-10px) scaleY(1.05); }
  }
  .hero-title { font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 28px; color: #FBF6EC; letter-spacing: 0.03em; }
  .hero-sub { margin-top: 6px; font-size: 12.5px; color: #9DBDAE; letter-spacing: 0.12em; }

  .panel { background: #FBF6EC; border-radius: 26px 26px 0 0; padding: 22px 16px 30px 16px; min-height: 55vh; }
  .cat-title {
    font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 16px; color: #16302B;
    margin: 22px 4px 10px 4px; display: flex; align-items: center; gap: 8px;
  }
  .cat-title:first-child { margin-top: 0; }
  .cat-title::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #E2672A; display: inline-block; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card {
    background: #fff; border-radius: 16px; padding: 12px; border: 1px solid #EFE6D4;
    text-align: left; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:active { transform: scale(0.97); }
  .card:hover { box-shadow: 0 6px 16px rgba(22,48,43,0.08); }
  .card-name { font-weight: 600; font-size: 14.5px; color: #1F2A24; }
  .card-desc { font-size: 11.5px; color: #8B8577; margin-top: 4px; line-height: 1.5; min-height: 32px; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .card-price { font-weight: 700; color: #C0562A; font-size: 14px; }
  .add-dot { width: 26px; height: 26px; border-radius: 50%; background: #16302B; color: #F5EBD8; display: flex; align-items: center; justify-content: center; font-size: 15px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(15,26,23,0.55);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 50; backdrop-filter: blur(2px);
  }
  .overlay.open { display: flex; }
  .sheet {
    width: 100%; max-width: 480px; background: #FBF6EC; border-radius: 22px 22px 0 0;
    padding: 20px 18px 26px 18px; animation: slideup .25s ease;
    max-height: 88vh; overflow-y: auto;
  }
  @keyframes slideup { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
  .sheet-title { font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 18px; color: #16302B; }
  .sheet-desc { font-size: 12px; color: #8B8577; margin-top: 4px; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 50%; background: #EFE6D4;
    display: flex; align-items: center; justify-content: center; color: #16302B;
    flex-shrink: 0; border: none; cursor: pointer; font-size: 15px;
  }
  .field-block { margin-bottom: 16px; }
  .field-label { font-size: 12.5px; font-weight: 600; color: #5C6B62; margin-bottom: 8px; }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 7px 14px; border-radius: 999px; font-size: 13px; border: 1px solid #DED2B7; background: #fff; color: #4A4438; cursor: pointer; }
  .chip.chip-on { background: #16302B; color: #F5EBD8; border-color: #16302B; }
  .qty-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .qty-num { min-width: 18px; text-align: center; font-weight: 600; }
  .primary-btn {
    width: 100%; padding: 14px; border-radius: 14px; background: #E2672A; color: #fff;
    font-weight: 600; font-size: 14.5px; border: none; cursor: pointer;
  }
  .primary-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .ghost-btn {
    width: 100%; padding: 13px; border-radius: 14px; background: transparent; color: #C0562A;
    font-weight: 600; font-size: 13.5px; border: 1px solid #E2672A; cursor: pointer;
  }
  .settings-ok { display: flex; align-items: center; gap: 8px; color: #2E6E4E; font-weight: 600; font-size: 13.5px; margin-bottom: 8px; }
  .settings-note { font-size: 12px; color: #8B8577; line-height: 1.6; margin-bottom: 14px; }
  .text-input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid #DED2B7; font-size: 13.5px; background: #fff; }

  .cartbar {
    position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: center; z-index: 40;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom)) 14px; pointer-events: none;
  }
  .cartbar.open { display: flex; }
  .cartbar-inner {
    pointer-events: auto; width: 100%; max-width: 480px; background: #16302B; border-radius: 16px;
    padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35); animation: slideup .25s ease;
  }
  .cartbar-left { display: flex; align-items: center; gap: 10px; color: #F5EBD8; }
  .cartbar-badge { background: #E2672A; color: #fff; font-size: 11px; font-weight: 700; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .cartbar-total { font-weight: 700; }
  .cartbar-btn { background: #E2672A; color: #fff; border: none; border-radius: 10px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }

  .cart-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .cart-row { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #EFE6D4; border-radius: 12px; padding: 10px 12px; }
  .cart-row-name { font-weight: 600; font-size: 13.5px; }
  .cart-row-meta { font-size: 11px; color: #8B8577; margin-top: 2px; }
  .cart-row-right { display: flex; align-items: center; gap: 10px; }
  .cart-price { font-size: 12.5px; color: #C0562A; font-weight: 700; min-width: 40px; text-align: right; }
  .empty-cart { text-align: center; padding: 30px 10px; color: #8B8577; font-size: 13px; }

  .total-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-top: 1px dashed #DED2B7; margin-bottom: 14px; }
  .total-label { font-size: 13px; color: #5C6B62; }
  .total-num { font-size: 19px; font-weight: 700; color: #16302B; }

  .error-text { color: #C0562A; font-size: 11.5px; margin-top: 6px; display: none; align-items: center; gap: 4px; }
  .error-text.show { display: flex; }

  .success-wrap { text-align: center; padding: 20px 6px 6px 6px; }
  .success-icon { width: 56px; height: 56px; border-radius: 50%; background: #E4F1E8; color: #2E6E4E; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px auto; font-size: 26px; }
  .success-title { font-family: 'Noto Serif SC', serif; font-weight: 700; font-size: 17px; color: #16302B; margin-bottom: 6px; }
  .success-sub { font-size: 12.5px; color: #8B8577; margin-bottom: 20px; }

  .spin { display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>

<div id="shell">
  <div class="topbar">
    <span class="brand">浮光茶集</span>
    <button class="icon-btn-top" id="btn-settings" aria-label="设置">⚙</button>
  </div>

  <div class="hero">
    <div class="hero-mark">
      <svg width="34" height="46" viewBox="0 0 34 46">
        <path d="M9 44c-4-4-4-8 0-12s4-8 0-12" stroke="#C69A4B" stroke-width="2" fill="none" stroke-linecap="round" class="wisp wisp-a" />
        <path d="M20 44c-4-4-4-8 0-12s4-8 0-12" stroke="#E2672A" stroke-width="2" fill="none" stroke-linecap="round" class="wisp wisp-b" />
      </svg>
    </div>
    <div class="hero-title">浮光茶集</div>
    <div class="hero-sub">现制茶饮 · 慢煮咖啡</div>
  </div>

  <div class="panel" id="panel"></div>
</div>

<div class="cartbar" id="cartbar">
  <div class="cartbar-inner">
    <div class="cartbar-left">
      <span class="cartbar-badge" id="cartbar-count">0</span>
      <span class="cartbar-total" id="cartbar-total">¥0</span>
    </div>
    <button class="cartbar-btn" id="btn-view-cart">查看订单 ›</button>
  </div>
</div>

<!-- Quick add modal -->
<div class="overlay" id="overlay-add">
  <div class="sheet">
    <div class="sheet-head">
      <div>
        <div class="sheet-title" id="add-name"></div>
        <div class="sheet-desc" id="add-desc"></div>
      </div>
      <button class="icon-btn" id="add-close">✕</button>
    </div>
    <div class="field-block">
      <div class="field-label">温度</div>
      <div class="chip-row" id="add-temps"></div>
    </div>
    <div class="field-block">
      <div class="field-label">甜度</div>
      <div class="chip-row" id="add-sweets"></div>
    </div>
    <div class="qty-row">
      <div class="field-label">数量</div>
      <div class="stepper">
        <button class="icon-btn" id="add-minus">–</button>
        <span class="qty-num" id="add-qty">1</span>
        <button class="icon-btn" id="add-plus">+</button>
      </div>
    </div>
    <button class="primary-btn" id="add-confirm">加入订单</button>
  </div>
</div>

<!-- Settings modal -->
<div class="overlay" id="overlay-settings">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title">店主设置 · 订单通知</div>
      <button class="icon-btn" id="settings-close">✕</button>
    </div>
    <div id="settings-body"></div>
  </div>
</div>

<!-- Cart modal -->
<div class="overlay" id="overlay-cart">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title">我的订单</div>
      <button class="icon-btn" id="cart-close">✕</button>
    </div>
    <div id="cart-body"></div>
  </div>
</div>

<!-- Checkout modal -->
<div class="overlay" id="overlay-checkout">
  <div class="sheet">
    <div id="checkout-body"></div>
  </div>
</div>

<script>
(function () {
  const MENU = [
    { category: "经典奶茶", items: [
      { id: "m1", name: "珍珠奶茶", desc: "醇厚锡兰红茶 · 手熬黑糖珍珠", price: 15 },
      { id: "m2", name: "芋泥波波", desc: "槟榔芋头现打 · 椰浆基底", price: 18 },
      { id: "m3", name: "抹茶拿铁", desc: "宇治抹茶 · 鲜牛乳", price: 17 },
      { id: "m4", name: "红豆奶茶", desc: "蜜红豆 · 阿萨姆红茶", price: 16 },
    ]},
    { category: "鲜果茶", items: [
      { id: "f1", name: "满杯百香果", desc: "三颗鲜百香果 · 蜂蜜", price: 19 },
      { id: "f2", name: "芒果冰沙", desc: "冻芒果现打 · 无添加水", price: 20 },
      { id: "f3", name: "手打柠檬茶", desc: "现切柠檬 · 蜜渍风味", price: 14 },
    ]},
    { category: "经典咖啡", items: [
      { id: "c1", name: "美式咖啡", desc: "双份浓缩 · 冷萃可选", price: 12 },
      { id: "c2", name: "招牌拿铁", desc: "意式浓缩 · 鲜奶拉花", price: 16 },
      { id: "c3", name: "生椰拿铁", desc: "厚椰乳 · 意式浓缩", price: 18 },
    ]},
  ];
  const TEMPS = ["冰", "常温", "热"];
  const SWEETS = ["全糖", "半糖", "微糖", "无糖"];

  let cart = [];
  let activeItem = null;
  let addTemp = "冰", addSweet = "半糖", addQty = 1;
  let tgStatus = "loading"; // loading | unset | set
  let tgConfig = null;
  let sendState = "idle";

  const $ = (id) => document.getElementById(id);

  /* ---------- menu render ---------- */
  function renderMenu() {
    const panel = $("panel");
    panel.innerHTML = "";
    MENU.forEach((cat) => {
      const title = document.createElement("div");
      title.className = "cat-title";
      title.textContent = cat.category;
      panel.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "grid";
      cat.items.forEach((item) => {
        const card = document.createElement("button");
        card.className = "card";
        card.innerHTML = `
          <div class="card-name">${item.name}</div>
          <div class="card-desc">${item.desc}</div>
          <div class="card-foot">
            <span class="card-price">¥${item.price}</span>
            <span class="add-dot">+</span>
          </div>`;
        card.addEventListener("click", () => openAdd(item));
        grid.appendChild(card);
      });
      panel.appendChild(grid);
    });
  }

  /* ---------- quick add modal ---------- */
  function openAdd(item) {
    activeItem = item;
    addTemp = "冰"; addSweet = "半糖"; addQty = 1;
    $("add-name").textContent = item.name;
    $("add-desc").textContent = item.desc;
    renderChips("add-temps", TEMPS, addTemp, (v) => { addTemp = v; renderChips("add-temps", TEMPS, addTemp, arguments.callee); });
    renderAddChips();
    $("add-qty").textContent = addQty;
    $("overlay-add").classList.add("open");
  }
  function renderAddChips() {
    renderChips("add-temps", TEMPS, addTemp, (v) => { addTemp = v; renderAddChips(); });
    renderChips("add-sweets", SWEETS, addSweet, (v) => { addSweet = v; renderAddChips(); });
    renderConfirmLabel();
  }
  function renderChips(containerId, options, selected, onPick) {
    const el = $(containerId);
    el.innerHTML = "";
    options.forEach((opt) => {
      const b = document.createElement("button");
      b.className = "chip" + (opt === selected ? " chip-on" : "");
      b.textContent = opt;
      b.addEventListener("click", () => onPick(opt));
      el.appendChild(b);
    });
  }
  function renderConfirmLabel() {
    if (!activeItem) return;
    $("add-confirm").textContent = `加入订单 · ¥${activeItem.price * addQty}`;
  }
  $("add-minus").addEventListener("click", () => { addQty = Math.max(1, addQty - 1); $("add-qty").textContent = addQty; renderConfirmLabel(); });
  $("add-plus").addEventListener("click", () => { addQty += 1; $("add-qty").textContent = addQty; renderConfirmLabel(); });
  $("add-close").addEventListener("click", () => $("overlay-add").classList.remove("open"));
  $("overlay-add").addEventListener("click", (e) => { if (e.target.id === "overlay-add") $("overlay-add").classList.remove("open"); });
  $("add-confirm").addEventListener("click", () => {
    const key = `${activeItem.id}-${addTemp}-${addSweet}`;
    const found = cart.find((c) => c.key === key);
    if (found) found.qty += addQty;
    else cart.push({ ...activeItem, temp: addTemp, sweet: addSweet, qty: addQty, key });
    $("overlay-add").classList.remove("open");
    updateCartBar();
  });

  /* ---------- cart bar + cart modal ---------- */
  function cartTotal() { return cart.reduce((s, i) => s + i.price * i.qty, 0); }
  function cartCount() { return cart.reduce((s, i) => s + i.qty, 0); }
  function updateCartBar() {
    const count = cartCount();
    if (count > 0) {
      $("cartbar").classList.add("open");
      $("cartbar-count").textContent = count;
      $("cartbar-total").textContent = `¥${cartTotal()}`;
    } else {
      $("cartbar").classList.remove("open");
    }
    if ($("overlay-cart").classList.contains("open")) renderCartBody();
  }
  $("btn-view-cart").addEventListener("click", () => { renderCartBody(); $("overlay-cart").classList.add("open"); });
  $("cart-close").addEventListener("click", () => $("overlay-cart").classList.remove("open"));
  $("overlay-cart").addEventListener("click", (e) => { if (e.target.id === "overlay-cart") $("overlay-cart").classList.remove("open"); });

  function renderCartBody() {
    const body = $("cart-body");
    if (cart.length === 0) {
      body.innerHTML = `<div class="empty-cart">还没有选购饮品呀</div>`;
      return;
    }
    let html = `<div class="cart-list">`;
    cart.forEach((i) => {
      html += `
        <div class="cart-row" data-key="${i.key}">
          <div>
            <div class="cart-row-name">${i.name}</div>
            <div class="cart-row-meta">${i.temp} · ${i.sweet}</div>
          </div>
          <div class="cart-row-right">
            <button class="icon-btn" data-act="minus" data-key="${i.key}">–</button>
            <span class="qty-num">${i.qty}</span>
            <button class="icon-btn" data-act="plus" data-key="${i.key}">+</button>
            <span class="cart-price">¥${i.price * i.qty}</span>
          </div>
        </div>`;
    });
    html += `</div>
      <div class="total-row"><span class="total-label">合计</span><span class="total-num">¥${cartTotal()}</span></div>
      <button class="primary-btn" id="cart-checkout-btn">去下单</button>`;
    body.innerHTML = html;

    body.querySelectorAll('[data-act="minus"]').forEach((b) => b.addEventListener("click", () => changeQty(b.dataset.key, -1)));
    body.querySelectorAll('[data-act="plus"]').forEach((b) => b.addEventListener("click", () => changeQty(b.dataset.key, 1)));
    $("cart-checkout-btn").addEventListener("click", () => {
      $("overlay-cart").classList.remove("open");
      openCheckout();
    });
  }
  function changeQty(key, delta) {
    cart = cart.map((i) => i.key === key ? { ...i, qty: i.qty + delta } : i).filter((i) => i.qty > 0);
    updateCartBar();
    renderCartBody();
  }

  /* ---------- settings (Telegram token / chat id) ---------- */
  async function loadTgConfig() {
    try {
      const res = await window.storage.get("tg-config", false);
      if (res && res.value) {
        tgConfig = JSON.parse(res.value);
        tgStatus = "set";
      } else {
        tgStatus = "unset";
      }
    } catch (e) {
      tgStatus = "unset";
    }
  }
  async function saveTgConfig(token, chatId) {
    await window.storage.set("tg-config", JSON.stringify({ token, chatId }), false);
    tgConfig = { 8939398684:AAGmsjumYDRjiARlGGVkDscjWybnxzy272Q, 1949334561 };
    tgStatus = "set";
  }
  async function clearTgConfig() {
    try { await window.storage.delete("tg-config", false); } catch (e) {}
    tgConfig = null;
    tgStatus = "unset";
  }
  async function sendToTelegram(text) {
    if (!tgConfig) throw new Error("尚未配置通知");
    const res = await fetch(`https://api.telegram.org/bot${tgConfig.token}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: tgConfig.chatId, text }),
    });
    if (!res.ok) throw new Error("发送失败");
    return res.json();
  }

  function renderSettingsBody() {
    const body = $("settings-body");
    if (tgStatus === "set") {
      body.innerHTML = `
        <div class="settings-ok">✓ 已配置 Telegram 通知</div>
        <p class="settings-note">出于安全考虑，已保存的凭证不会在此处显示。如需更换，请先清除后重新填写。</p>
        <button class="ghost-btn" id="settings-clear">清除并重新设置</button>`;
      $("settings-clear").addEventListener("click", async () => { await clearTgConfig(); renderSettingsBody(); });
    } else {
      body.innerHTML = `
        <p class="settings-note">这些信息只会保存在本机、用于把订单发送到你的 Telegram，不会在应用的任何地方显示出来。</p>
        <div class="field-block">
          <div class="field-label">Bot Token</div>
          <input type="password" autocomplete="off" class="text-input" id="settings-token" placeholder="输入一次即可，不会再显示" />
        </div>
        <div class="field-block">
          <div class="field-label">Chat ID</div>
          <input type="password" autocomplete="off" class="text-input" id="settings-chatid" placeholder="接收订单消息的对话 ID" />
        </div>
        <button class="primary-btn" id="settings-save" disabled>保存设置</button>`;
      const tokenInput = $("settings-token"), chatInput = $("settings-chatid"), saveBtn = $("settings-save");
      const toggle = () => { saveBtn.disabled = !(tokenInput.value.trim() && chatInput.value.trim()); };
      tokenInput.addEventListener("input", toggle);
      chatInput.addEventListener("input", toggle);
      saveBtn.addEventListener("click", async () => {
        saveBtn.disabled = true;
        saveBtn.textContent = "保存中…";
        await saveTgConfig(tokenInput.value.trim(), chatInput.value.trim());
        renderSettingsBody();
      });
    }
  }
  $("btn-settings").addEventListener("click", () => { renderSettingsBody(); $("overlay-settings").classList.add("open"); });
  $("settings-close").addEventListener("click", () => $("overlay-settings").classList.remove("open"));
  $("overlay-settings").addEventListener("click", (e) => { if (e.target.id === "overlay-settings") $("overlay-settings").classList.remove("open"); });

  /* ---------- checkout ---------- */
  function openCheckout() {
    sendState = "idle";
    renderCheckoutBody();
    $("overlay-checkout").classList.add("open");
  }
  function renderCheckoutBody() {
    const body = $("checkout-body");
    if (sendState === "done") {
      body.innerHTML = `
        <div class="success-wrap">
          <div class="success-icon">✓</div>
          <div class="success-title">订单已发送</div>
          <div class="success-sub">老板已收到通知，马上为您安排制作～</div>
          <button class="primary-btn" id="checkout-reset">再点一单</button>
        </div>`;
      $("checkout-reset").addEventListener("click", resetOrder);
      return;
    }

    body.innerHTML = `
      <div class="sheet-head">
        <div class="sheet-title">填写取餐信息</div>
        <button class="icon-btn" id="checkout-close">✕</button>
      </div>
      ${tgStatus === "unset" ? `<div class="error-text show">⚠ 店铺尚未开启订单通知，请联系店主先完成设置</div>` : ""}
      <div class="field-block">
        <div class="field-label">姓名 *</div>
        <input class="text-input" id="co-name" placeholder="怎么称呼您" />
        <div class="error-text" id="co-name-err">⚠ 请填写姓名</div>
      </div>
      <div class="field-block">
        <div class="field-label">电话号码 *</div>
        <input class="text-input" id="co-phone" placeholder="方便店家联系您" inputmode="tel" />
        <div class="error-text" id="co-phone-err">⚠ 电话号码格式不太对</div>
      </div>
      <div class="field-block">
        <div class="field-label">备注（选填）</div>
        <input class="text-input" id="co-note" placeholder="少冰、不要吸管…" />
      </div>
      <div class="total-row"><span class="total-label">合计 · ${cartCount()} 件</span><span class="total-num">¥${cartTotal()}</span></div>
      <div class="error-text" id="co-send-err">⚠ 发送失败，请稍后重试或联系店主</div>
      <button class="primary-btn" id="co-submit" ${tgStatus !== "set" ? "disabled" : ""}>提交订单</button>`;

    $("checkout-close").addEventListener("click", () => $("overlay-checkout").classList.remove("open"));
    $("co-submit").addEventListener("click", submitOrder);
  }
  $("overlay-checkout").addEventListener("click", (e) => { if (e.target.id === "overlay-checkout" && sendState !== "sending") $("overlay-checkout").classList.remove("open"); });

  async function submitOrder() {
    const name = $("co-name").value.trim();
    const phone = $("co-phone").value.trim();
    const note = $("co-note").value.trim();
    let ok = true;
    $("co-name-err").classList.remove("show");
    $("co-phone-err").classList.remove("show");
    if (!name) { $("co-name-err").classList.add("show"); ok = false; }
    if (!phone || !/^[\d+\-\s]{6,20}$/.test(phone)) { $("co-phone-err").classList.add("show"); ok = false; }
    if (!ok) return;

    sendState = "sending";
    const btn = $("co-submit");
    btn.disabled = true;
    btn.innerHTML = `<span class="spin">⟳</span> 提交中…`;
    $("co-send-err").classList.remove("show");

    const lines = cart.map((i) => `· ${i.name}（${i.temp}/${i.sweet}）x${i.qty} — ¥${i.price * i.qty}`);
    const text = ["🧋 新订单", `顾客：${name}`, `电话：${phone}`, "", ...lines, "", `合计：¥${cartTotal()}`, note ? `备注：${note}` : null]
      .filter(Boolean).join("\n");

    try {
      await sendToTelegram(text);
      sendState = "done";
      renderCheckoutBody();
    } catch (e) {
      sendState = "error";
      $("co-send-err").classList.add("show");
      btn.disabled = false;
      btn.textContent = "提交订单";
      sendState = "idle";
    }
  }
  function resetOrder() {
    cart = [];
    updateCartBar();
    $("overlay-checkout").classList.remove("open");
  }

  /* ---------- init ---------- */
  renderMenu();
  loadTgConfig();
})();
</script>
