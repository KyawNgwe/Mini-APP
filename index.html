<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餐厅点餐</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .menu {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 12px;
    }

    .menu button {
      float: right;
      padding: 8px 15px;
    }

    .cart {
      background: white;
      padding: 15px;
      margin-top: 20px;
      border-radius: 12px;
    }

    .order-btn {
      width: 100%;
      padding: 15px;
      background: #0088cc;
      color: white;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      margin-top: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h1>🍜 我的餐厅</h1>

<div class="menu">
  <b>炒饭</b>
  <span> ฿60</span>
  <button onclick="addItem('炒饭', 60)">+</button>
</div>

<div class="menu">
  <b>炒面</b>
  <span> ฿50</span>
  <button onclick="addItem('炒面', 50)">+</button>
</div>

<div class="menu">
  <b>鸡肉饭</b>
  <span> ฿70</span>
  <button onclick="addItem('鸡肉饭', 70)">+</button>
</div>

<div class="menu">
  <b>可乐</b>
  <span> ฿25</span>
  <button onclick="addItem('可乐', 25)">+</button>
</div>

<div class="cart">
  <h2>🛒 我的订单</h2>

  <div id="cart"></div>

  <h3 id="total">总计：฿0</h3>

  <input id="table" placeholder="请输入桌号，例如：12">

  <button class="order-btn" onclick="sendOrder()">
    📲 提交订单
  </button>
</div>

<script>

let cart = [];

function addItem(name, price) {

  let item = cart.find(x => x.name === name);

  if (item) {
    item.qty++;
  } else {
    cart.push({
      name: name,
      price: price,
      qty: 1
    });
  }

  showCart();
}

function showCart() {

  let html = "";
  let total = 0;

  cart.forEach(item => {

    let subtotal = item.price * item.qty;

    total += subtotal;

    html += `
      <p>
        ${item.name} × ${item.qty}
        = ฿${subtotal}
      </p>
    `;
  });

  document.getElementById("cart").innerHTML = html;
  document.getElementById("total").innerText =
    "总计：฿" + total;
}

async function sendOrder() {

  let table = document.getElementById("table").value;

  if (!table) {
    alert("请输入桌号");
    return;
  }

  if (cart.length === 0) {
    alert("请先选择菜品");
    return;
  }

  let message = "🍜 新订单%0A";
  message += "━━━━━━━━━━%0A";
  message += "🪑 桌号：" + table + "%0A%0A";

  let total = 0;

  cart.forEach(item => {

    let subtotal = item.price * item.qty;

    total += subtotal;

    message +=
      "🍽 " +
      item.name +
      " × " +
      item.qty +
      " = ฿" +
      subtotal +
      "%0A";
  });

  message += "%0A💰 总计：฿" + total;

  // 修改这里
  const BOT_TOKEN = "YOUR_BOT_TOKEN";
  const CHAT_ID = "YOUR_CHAT_ID";

  const url =
    `8939398684:AAHscEJ4st2XHCBNgFpcfpFH7Cu8MqNLTjk` +
    `?chat_id=${1949334561}&text=${message}`;

  try {

    await fetch(url);

    alert("✅ 订单已经发送！");

    cart = [];
    showCart();

  } catch (error) {

    alert("❌ 发送失败");

  }
}

</script>

</body>
</html>
