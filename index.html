<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老灶食堂 · 点餐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241C16;
    --wok:#332821;
    --wok-2:#3d302a;
    --parchment:#EFE2C8;
    --parchment-dim:#cdbf9e;
    --brick:#B33A2E;
    --brick-dark:#8c2c22;
    --scallion:#7A9B57;
    --gold:#D4A24C;
    --line: rgba(239,226,200,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--parchment);
    font-family:'Noto Sans SC', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  ::selection{ background:var(--brick); color:var(--parchment); }

  /* subtle char texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(212,162,76,0.05), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(179,58,46,0.06), transparent 45%);
    pointer-events:none;
    z-index:0;
  }

  .app{ position:relative; z-index:1; max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  header.top{
    padding:28px 20px 18px;
    text-align:center;
    position:relative;
  }
  .brand-seal{
    width:46px;height:46px;
    border:2px solid var(--brick);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 10px;
    color:var(--brick);
    font-family:'Noto Serif SC',serif;
    font-weight:900;
    font-size:18px;
    transform:rotate(-6deg);
    opacity:0.9;
  }
  h1.title{
    font-family:'Noto Serif SC', serif;
    font-weight:900;
    font-size:30px;
    margin:0;
    letter-spacing:2px;
    color:var(--parchment);
  }
  p.tagline{
    margin:6px 0 0;
    font-size:12.5px;
    letter-spacing:3px;
    color:var(--parchment-dim);
    text-transform:uppercase;
  }
  .divider{
    width:64px;height:2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    margin:16px auto 0;
  }

  /* category nav */
  .cat-nav{
    display:flex; gap:8px; overflow-x:auto;
    padding:14px 16px; margin:0 4px;
    scrollbar-width:none;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex:0 0 auto;
    font-family:'Noto Serif SC',serif;
    font-weight:700;
    font-size:14px;
    padding:8px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    color:var(--parchment-dim);
    background:transparent;
    cursor:pointer;
    transition:all .2s ease;
    white-space:nowrap;
  }
  .cat-chip.active{
    background:var(--brick);
    border-color:var(--brick);
    color:#fff;
  }

  main{ flex:1; padding:4px 16px 140px; }

  .cat-section{ margin-top:22px; }
  .cat-heading{
    display:flex; align-items:baseline; gap:10px;
    margin:0 4px 10px;
  }
  .cat-heading .zh{
    font-family:'Noto Serif SC',serif; font-weight:700; font-size:19px; color:var(--gold);
  }
  .cat-heading .en{
    font-size:10px; letter-spacing:2px; color:var(--parchment-dim); text-transform:uppercase;
  }
  .cat-heading::after{
    content:"";
    flex:1; height:1px;
    background:var(--line);
  }

  .dish{
    display:flex; align-items:center; gap:14px;
    padding:14px 10px;
    border-bottom:1px solid var(--line);
  }
  .dish-icon{
    width:52px;height:52px; flex:0 0 auto;
    border-radius:12px;
    background:var(--wok-2);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;
    border:1px solid var(--line);
  }
  .dish-info{ flex:1; min-width:0; }
  .dish-name{ font-weight:700; font-size:15.5px; color:var(--parchment); }
  .dish-desc{ font-size:12px; color:var(--parchment-dim); margin-top:3px; line-height:1.5; }
  .dish-price{
    font-family:'JetBrains Mono',monospace; font-weight:600;
    color:var(--gold); font-size:14px; margin-top:5px;
  }
  .dish-price::before{ content:"¥"; font-size:11px; margin-right:1px; opacity:.8;}

  .stepper{ display:flex; align-items:center; gap:0; flex:0 0 auto; }
  .stepper button{
    width:30px;height:30px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--wok-2);
    color:var(--parchment);
    font-size:16px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:.15s;
  }
  .stepper button.add{ background:var(--brick); border-color:var(--brick); color:#fff;}
  .stepper button:active{ transform:scale(0.9); }
  .stepper .qty{
    width:26px; text-align:center; font-family:'JetBrains Mono',monospace; font-weight:600; font-size:14px;
  }
  .stepper.zero .minus, .stepper.zero .qty{ display:none; }

  /* cart bar */
  .cart-bar{
    position:fixed; left:0; right:0; bottom:0;
    max-width:560px; margin:0 auto;
    background:var(--brick);
    color:#fff;
    padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between;
    border-radius:18px 18px 0 0;
    box-shadow:0 -8px 28px rgba(0,0,0,0.35);
    cursor:pointer;
    transform:translateY(110%);
    transition:transform .35s cubic-bezier(.2,.9,.3,1.2);
    z-index:40;
  }
  .cart-bar.show{ transform:translateY(0); }
  .cart-left{ display:flex; align-items:center; gap:12px; }
  .cart-count{
    background:rgba(255,255,255,0.2);
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px;
  }
  .cart-total{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px;}
  .cart-cta{ font-weight:700; font-size:14px; letter-spacing:1px;}

  /* drawer */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    opacity:0; pointer-events:none; transition:opacity .3s;
    z-index:50;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; left:0; right:0; bottom:0;
    max-width:560px; margin:0 auto;
    background:var(--wok);
    border-radius:20px 20px 0 0;
    padding:20px 20px 24px;
    transform:translateY(100%);
    transition:transform .35s cubic-bezier(.2,.9,.3,1.1);
    z-index:51;
    max-height:82vh;
    overflow-y:auto;
  }
  .drawer.show{ transform:translateY(0); }
  .drawer-handle{
    width:36px;height:4px;background:var(--line);border-radius:2px;
    margin:0 auto 16px;
  }
  .drawer h2{
    font-family:'Noto Serif SC',serif; font-size:19px; margin:0 0 14px; color:var(--parchment);
  }
  .cart-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .cart-item .name{ font-size:14px; }
  .cart-item .sub{ font-size:11px; color:var(--parchment-dim); margin-top:2px;}
  .field{ margin-top:16px; }
  .field label{ font-size:12px; color:var(--parchment-dim); letter-spacing:1px; }
  .field input, .field textarea{
    width:100%; margin-top:6px;
    background:var(--wok-2); border:1px solid var(--line);
    border-radius:10px; padding:11px 12px;
    color:var(--parchment); font-family:inherit; font-size:14px;
  }
  .field textarea{ resize:none; height:56px; }
  .total-row{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:18px; padding-top:14px; border-top:1px dashed var(--line);
  }
  .total-row .label{ font-size:13px; color:var(--parchment-dim); }
  .total-row .amount{ font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; color:var(--gold);}
  .submit-btn{
    width:100%; margin-top:16px;
    background:var(--brick); color:#fff; border:none;
    padding:15px; border-radius:12px;
    font-family:'Noto Serif SC',serif; font-weight:700; font-size:16px;
    letter-spacing:2px; cursor:pointer;
  }
  .submit-btn:disabled{ opacity:.4; }
  .empty-cart{ text-align:center; color:var(--parchment-dim); padding:30px 0; font-size:13px;}

  /* confirmation stamp */
  .stamp-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.72);
    display:flex; align-items:center; justify-content:center;
    z-index:80; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .stamp-overlay.show{ opacity:1; pointer-events:auto; }
  .stamp{
    width:150px;height:150px; border-radius:50%;
    border:4px solid var(--brick);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--brick); background:rgba(179,58,46,0.06);
    transform:rotate(-12deg) scale(0.4); opacity:0;
    transition:transform .5s cubic-bezier(.2,1.4,.4,1), opacity .3s;
  }
  .stamp-overlay.show .stamp{ transform:rotate(-12deg) scale(1); opacity:1; }
  .stamp .big{ font-family:'Noto Serif SC',serif; font-weight:900; font-size:28px; letter-spacing:2px;}
  .stamp .small{ font-size:10px; letter-spacing:3px; margin-top:6px;}
  .stamp-caption{
    position:absolute; bottom:36%; text-align:center; color:var(--parchment); font-size:13px; opacity:0;
    transition:opacity .4s .3s;
  }
  .stamp-overlay.show .stamp-caption{ opacity:1; }

  footer.foot{
    text-align:center; padding:18px 0 30px; color:var(--parchment-dim); font-size:11px; letter-spacing:1px;
  }
  footer.foot a{ color:var(--parchment-dim); text-decoration:none; border-bottom:1px dotted var(--parchment-dim); cursor:pointer; }

  /* ================= ADMIN ================= */
  .admin-app{ max-width:560px; margin:0 auto; min-height:100vh; padding-bottom:40px; position:relative; z-index:1;}
  .admin-top{
    padding:22px 20px 16px; display:flex; align-items:center; justify-content:space-between;
  }
  .admin-title{ font-family:'Noto Serif SC',serif; font-weight:900; font-size:20px; display:flex; align-items:center; gap:10px;}
  .live-dot{ width:8px;height:8px;border-radius:50%; background:var(--scallion); box-shadow:0 0 0 0 rgba(122,155,87,0.6); animation:pulse 2s infinite; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(122,155,87,0.55);}
    70%{ box-shadow:0 0 0 8px rgba(122,155,87,0);}
    100%{ box-shadow:0 0 0 0 rgba(122,155,87,0);}
  }
  .back-link{ font-size:12px; color:var(--parchment-dim); cursor:pointer; border-bottom:1px dotted var(--parchment-dim); }
  .admin-stats{ display:flex; gap:10px; padding:0 20px 16px; }
  .stat-card{
    flex:1; background:var(--wok); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px;
  }
  .stat-card .num{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px; color:var(--gold);}
  .stat-card .lbl{ font-size:10.5px; color:var(--parchment-dim); letter-spacing:1px; margin-top:2px;}

  .tickets{ padding:0 20px; display:flex; flex-direction:column; gap:14px;}
  .ticket{
    background:var(--wok);
    border:1px solid var(--line);
    border-radius:4px 4px 10px 10px;
    padding:16px 16px 14px;
    position:relative;
    animation: dropIn .4s cubic-bezier(.2,.9,.3,1.1);
  }
  .ticket.status-new{ border-color:var(--brick); box-shadow:0 0 0 1px rgba(179,58,46,0.35), 0 8px 20px rgba(179,58,46,0.12);}
  .ticket::before{
    content:""; position:absolute; top:-1px; left:14px; right:14px; height:6px;
    background:repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 12px);
  }
  @keyframes dropIn{ from{ opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }
  .ticket-head{ display:flex; justify-content:space-between; align-items:flex-start; }
  .ticket-table{ font-family:'Noto Serif SC',serif; font-weight:700; font-size:16px; }
  .ticket-time{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--parchment-dim); }
  .ticket-badge{
    font-size:10px; letter-spacing:1px; padding:3px 9px; border-radius:999px; font-weight:700;
  }
  .badge-new{ background:var(--brick); color:#fff; }
  .badge-preparing{ background:var(--gold); color:var(--ink); }
  .badge-done{ background:var(--scallion); color:var(--ink); }
  .ticket-items{ margin:10px 0; font-size:13px; }
  .ticket-items .row{ display:flex; justify-content:space-between; padding:3px 0; color:var(--parchment-dim); }
  .ticket-items .row .n{ color:var(--parchment); }
  .ticket-remark{ font-size:12px; color:var(--gold); margin-top:4px; }
  .ticket-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:10px; border-top:1px dashed var(--line);}
  .ticket-total{ font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--gold);}
  .ticket-actions button{
    border:none; padding:8px 14px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer;
    margin-left:8px;
  }
  .btn-prep{ background:var(--gold); color:var(--ink); }
  .btn-done{ background:var(--scallion); color:var(--ink); }
  .empty-admin{ text-align:center; padding:60px 20px; color:var(--parchment-dim); font-size:13px; }

  /* passcode gate */
  .gate{
    position:fixed; inset:0; background:var(--ink); z-index:100;
    display:flex; align-items:center; justify-content:center; flex-direction:column; padding:20px;
  }
  .gate .brand-seal{ margin-bottom:18px; }
  .gate h2{ font-family:'Noto Serif SC',serif; margin:0 0 4px; }
  .gate p{ font-size:12px; color:var(--parchment-dim); margin:0 0 20px; }
  .gate input{
    background:var(--wok-2); border:1px solid var(--line); color:var(--parchment);
    padding:12px 16px; border-radius:10px; text-align:center; letter-spacing:6px;
    font-family:'JetBrains Mono',monospace; font-size:18px; width:180px;
  }
  .gate button{
    margin-top:14px; background:var(--brick); color:#fff; border:none;
    padding:11px 30px; border-radius:10px; font-weight:700; cursor:pointer;
  }
  .gate .err{ color:var(--brick); font-size:12px; margin-top:10px; height:14px; }
  .gate .hint{ margin-top:18px; font-size:11px; color:var(--parchment-dim); opacity:.6; }

  /* telegram settings modal */
  .settings-btn{
    width:34px;height:34px; border-radius:50%;
    border:1px solid var(--line); background:var(--wok-2);
    color:var(--parchment-dim); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:15px;
  }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:flex; align-items:center; justify-content:center; z-index:95;
    padding:20px;
  }
  .modal-card{
    width:100%; max-width:400px; background:var(--wok);
    border:1px solid var(--line); border-radius:16px; padding:22px;
  }
  .modal-card h3{
    font-family:'Noto Serif SC',serif; margin:0 0 4px; font-size:17px; display:flex; align-items:center; gap:8px;
  }
  .modal-card .desc{ font-size:12px; color:var(--parchment-dim); line-height:1.6; margin:0 0 16px; }
  .modal-card .field label{ font-size:11.5px; color:var(--parchment-dim); }
  .modal-card .field input{ font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:0; text-align:left; width:100%; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .modal-actions button{
    flex:1; border:none; padding:11px; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .modal-save{ background:var(--brick); color:#fff; }
  .modal-test{ background:var(--wok-2); color:var(--parchment); border:1px solid var(--line) !important; }
  .modal-close{ text-align:center; margin-top:12px; font-size:12px; color:var(--parchment-dim); cursor:pointer; }
  .modal-status{ font-size:12px; margin-top:10px; min-height:16px; }
  .modal-status.ok{ color:var(--scallion); }
  .modal-status.err{ color:var(--brick); }
  .tg-badge{
    display:inline-flex; align-items:center; gap:5px;
    font-size:10.5px; color:var(--parchment-dim); margin-top:2px;
  }
  .tg-dot{ width:6px;height:6px;border-radius:50%; background:var(--scallion); }
  .tg-dot.off{ background:var(--parchment-dim); opacity:.5; }

  .toast{
    position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-40px);
    background:var(--scallion); color:var(--ink); font-weight:700; font-size:13px;
    padding:10px 18px; border-radius:999px; z-index:90; opacity:0; transition:all .35s;
    white-space:nowrap;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>

<div id="root"></div>

<script>
(function(){
  "use strict";

  /* ---------------- data ---------------- */
  var MENU = [
    { cat:"招牌菜", en:"Signature", items:[
      {id:"d1", name:"老灶回锅肉", desc:"二刀肉 · 青蒜 · 郫县豆瓣", price:38, icon:"🥩"},
      {id:"d2", name:"农家小炒黄牛肉", desc:"黄牛肉 · 野山椒 · 香芹", price:52, icon:"🐂"},
      {id:"d3", name:"柴火大盘鸡", desc:"土鸡 · 土豆 · 手擀面", price:68, icon:"🐔"},
    ]},
    { cat:"家常菜", en:"Home-style", items:[
      {id:"d4", name:"干煸豆角", desc:"豇豆 · 肉末 · 花椒", price:24, icon:"🫛"},
      {id:"d5", name:"麻婆豆腐", desc:"嫩豆腐 · 牛肉末 · 花椒油", price:22, icon:"🧊"},
      {id:"d6", name:"农家蒜苔炒肉", desc:"蒜苔 · 五花肉", price:26, icon:"🥬"},
      {id:"d7", name:"酸菜鱼", desc:"草鱼片 · 老坛酸菜", price:58, icon:"🐟"},
    ]},
    { cat:"汤羹", en:"Soups", items:[
      {id:"d8", name:"老鸭冬瓜汤", desc:"土鸭 · 冬瓜 · 慢炖三小时", price:36, icon:"🍲"},
      {id:"d9", name:"番茄蛋汤", desc:"农家番茄 · 土鸡蛋", price:16, icon:"🍅"},
    ]},
    { cat:"主食", en:"Staples", items:[
      {id:"d10", name:"柴火米饭", desc:"当季新米", price:3, icon:"🍚"},
      {id:"d11", name:"手工葱花饼", desc:"现烙 · 现切", price:12, icon:"🥞"},
    ]},
    { cat:"饮品", en:"Drinks", items:[
      {id:"d12", name:"自酿酸梅汤", desc:"乌梅 · 山楂 · 冰镇", price:10, icon:"🥤"},
      {id:"d13", name:"鲜榨橙汁", desc:"当季鲜橙", price:14, icon:"🍊"},
    ]},
  ];

  var STATUS_LABEL = { "new":"新订单", "preparing":"制作中", "done":"已完成" };

  /* ---------------- helpers ---------------- */
  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    for(var k in attrs){
      if(k === "class") e.className = attrs[k];
      else if(k === "html") e.innerHTML = attrs[k];
      else if(k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){
      if(c === null || c === undefined) return;
      if(typeof c === "string") e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    });
    return e;
  }
  function fmtTime(ts){
    var d = new Date(ts);
    var h = d.getHours().toString().padStart(2,"0");
    var m = d.getMinutes().toString().padStart(2,"0");
    return h+":"+m;
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  async function storageSet(key, value, shared){
    try{ return await window.storage.set(key, value, !!shared); }
    catch(e){ console.error("storage set failed", e); return null; }
  }
  async function storageGet(key, shared){
    try{ return await window.storage.get(key, !!shared); }
    catch(e){ return null; }
  }
  async function storageList(prefix, shared){
    try{ return await window.storage.list(prefix, !!shared); }
    catch(e){ return null; }
  }

  /* ---------------- telegram ---------------- */
  async function getTelegramConfig(){
    var t = await storageGet("config:telegram_token", true);
    var c = await storageGet("config:telegram_chatid", true);
    return {
      token: t && t.value ? t.value : "",
      chatId: c && c.value ? c.value : ""
    };
  }
  async function saveTelegramConfig(token, chatId){
    await storageSet("config:telegram_token", token, true);
    await storageSet("config:telegram_chatid", chatId, true);
  }
  function buildOrderMessage(order){
    var lines = [];
    lines.push("🍜 老灶食堂 · 新订单");
    lines.push("桌号：" + order.table);
    lines.push("时间：" + fmtTime(order.time));
    lines.push("");
    order.items.forEach(function(it){
      lines.push("• " + it.name + " ×" + it.qty + "  ¥" + (it.price*it.qty));
    });
    lines.push("");
    lines.push("合计：¥" + order.total);
    if(order.remark) lines.push("备注：" + order.remark);
    return lines.join("\n");
  }
  async function sendTelegramMessage(text){
    var cfg = await getTelegramConfig();
    if(!cfg.token || !cfg.chatId){
      return { ok:false, reason:"not_configured" };
    }
    try{
      var res = await fetch("https://api.telegram.org/bot" + cfg.token + "/sendMessage", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: cfg.chatId, text: text })
      });
      var data = await res.json();
      if(!res.ok || !data.ok){
        return { ok:false, reason: (data && data.description) || ("HTTP " + res.status) };
      }
      return { ok:true };
    } catch(e){
      return { ok:false, reason: "network" };
    }
  }
  async function notifyTelegramForOrder(order){
    var text = buildOrderMessage(order);
    var result = await sendTelegramMessage(text);
    if(!result.ok){
      console.warn("Telegram 通知未发送：", result.reason);
    }
  }

  /* ---------------- state ---------------- */
  var state = {
    view: "customer", // customer | admin
    activeCat: MENU[0].cat,
    cart: {}, // id -> qty
    drawerOpen: false,
    table: "",
    remark: "",
    submitting: false,
    adminUnlocked: false,
    adminOrders: [],
    knownOrderIds: {},
    settingsOpen: false,
    tgToken: "",
    tgChatId: "",
    tgStatus: "",
    tgStatusType: "",
    tgConfigured: false
  };

  var root = document.getElementById("root");

  function render(){
    root.innerHTML = "";
    if(state.view === "customer"){
      root.appendChild(renderCustomer());
    } else {
      if(!state.adminUnlocked){
        root.appendChild(renderGate());
      } else {
        root.appendChild(renderAdmin());
      }
    }
  }

  /* ================= CUSTOMER VIEW ================= */
  function cartCount(){
    var c = 0;
    for(var id in state.cart) c += state.cart[id];
    return c;
  }
  function cartTotal(){
    var total = 0;
    for(var id in state.cart){
      var dish = findDish(id);
      if(dish) total += dish.price * state.cart[id];
    }
    return total;
  }
  function findDish(id){
    for(var i=0;i<MENU.length;i++){
      for(var j=0;j<MENU[i].items.length;j++){
        if(MENU[i].items[j].id === id) return MENU[i].items[j];
      }
    }
    return null;
  }

  function renderCustomer(){
    var wrap = el("div", {class:"app"});

    wrap.appendChild(el("header", {class:"top"}, [
      el("div", {class:"brand-seal"}, ["灶"]),
      el("h1", {class:"title"}, ["老灶食堂"]),
      el("p", {class:"tagline"}, ["OLD STOVE CANTEEN · 柴火慢做"]),
      el("div", {class:"divider"})
    ]));

    // category nav
    var nav = el("nav", {class:"cat-nav"});
    MENU.forEach(function(section){
      var chip = el("button", {
        class: "cat-chip" + (state.activeCat === section.cat ? " active" : ""),
        onclick: function(){
          state.activeCat = section.cat;
          document.getElementById("sec-"+section.cat).scrollIntoView({behavior:"smooth", block:"start"});
        }
      }, [section.cat]);
      nav.appendChild(chip);
    });
    wrap.appendChild(nav);

    var main = el("main", {});
    MENU.forEach(function(section){
      var sec = el("section", {class:"cat-section", id:"sec-"+section.cat});
      sec.appendChild(el("div", {class:"cat-heading"}, [
        el("span", {class:"zh"}, [section.cat]),
        el("span", {class:"en"}, [section.en])
      ]));
      section.items.forEach(function(dish){
        sec.appendChild(renderDishRow(dish));
      });
      main.appendChild(sec);
    });
    wrap.appendChild(main);

    // cart bar
    var count = cartCount();
    var bar = el("div", {
      class: "cart-bar" + (count > 0 ? " show" : ""),
      onclick: function(){ state.drawerOpen = true; render(); }
    }, [
      el("div", {class:"cart-left"}, [
        el("div", {class:"cart-count"}, [String(count)]),
        el("div", {class:"cart-total"}, ["¥" + cartTotal()])
      ]),
      el("div", {class:"cart-cta"}, ["去下单 →"])
    ]);
    wrap.appendChild(bar);

    // overlay + drawer
    if(state.drawerOpen){
      wrap.appendChild(el("div", {class:"overlay show", onclick:function(){ state.drawerOpen=false; render(); }}));
      wrap.appendChild(renderDrawer());
    }

    wrap.appendChild(el("footer", {class:"foot"}, [
      "老灶食堂 · 现点现做，请耐心等待  ·  ",
      el("a", {onclick:function(){ state.view="admin"; render(); }}, ["后厨接单"])
    ]));

    wrap.appendChild(el("div", {class:"stamp-overlay", id:"stampOverlay"}, [
      el("div", {class:"stamp-caption"}, ["订单已送达后厨"]),
      el("div", {class:"stamp"}, [
        el("div", {class:"big"}, ["已下单"]),
        el("div", {class:"small"}, ["CONFIRMED"])
      ])
    ]));

    return wrap;
  }

  function renderDishRow(dish){
    var qty = state.cart[dish.id] || 0;
    var stepper = el("div", {class:"stepper" + (qty === 0 ? " zero" : "")}, [
      el("button", {class:"minus", onclick:function(){
        if(state.cart[dish.id] > 1) state.cart[dish.id]--;
        else delete state.cart[dish.id];
        render();
      }}, ["−"]),
      el("div", {class:"qty"}, [String(qty)]),
      el("button", {class:"add", onclick:function(){
        state.cart[dish.id] = (state.cart[dish.id]||0) + 1;
        render();
      }}, ["+"])
    ]);

    return el("div", {class:"dish"}, [
      el("div", {class:"dish-icon"}, [dish.icon]),
      el("div", {class:"dish-info"}, [
        el("div", {class:"dish-name"}, [dish.name]),
        el("div", {class:"dish-desc"}, [dish.desc]),
        el("div", {class:"dish-price"}, [String(dish.price)])
      ]),
      stepper
    ]);
  }

  function renderDrawer(){
    var items = Object.keys(state.cart);
    var body;
    if(items.length === 0){
      body = el("div", {class:"empty-cart"}, ["购物车是空的，去挑几道菜吧"]);
    } else {
      body = el("div", {}, items.map(function(id){
        var dish = findDish(id);
        var qty = state.cart[id];
        return el("div", {class:"cart-item"}, [
          el("div", {}, [
            el("div", {class:"name"}, [dish.name]),
            el("div", {class:"sub"}, ["¥"+dish.price+" × "+qty])
          ]),
          el("div", {style:"font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--gold);"}, ["¥"+(dish.price*qty)])
        ]);
      }));
    }

    var canSubmit = items.length > 0 && state.table.trim().length > 0 && !state.submitting;

    var drawer = el("div", {class:"drawer show"}, [
      el("div", {class:"drawer-handle"}),
      el("h2", {}, ["确认订单"]),
      body,
      el("div", {class:"field"}, [
        el("label", {}, ["桌号 / 取餐姓名"]),
        el("input", {
          type:"text", placeholder:"例如：8号桌 或 王先生",
          value: state.table,
          oninput: function(e){ state.table = e.target.value; syncSubmitButton(); }
        })
      ]),
      el("div", {class:"field"}, [
        el("label", {}, ["备注（口味 / 忌口，选填）"]),
        el("textarea", {
          placeholder:"例如：不要香菜，微辣",
          oninput: function(e){ state.remark = e.target.value; }
        }, [state.remark])
      ]),
      el("div", {class:"total-row"}, [
        el("div", {class:"label"}, ["合计"]),
        el("div", {class:"amount"}, ["¥"+cartTotal()])
      ]),
      el("button", {
        class:"submit-btn", id:"submitBtn",
        disabled: !canSubmit,
        onclick: submitOrder
      }, [state.submitting ? "提交中…" : "确认下单"])
    ]);
    return drawer;
  }

  function syncSubmitButton(){
    var btn = document.getElementById("submitBtn");
    if(!btn) return;
    var items = Object.keys(state.cart);
    btn.disabled = !(items.length > 0 && state.table.trim().length > 0 && !state.submitting);
  }

  async function submitOrder(){
    if(state.submitting) return;
    state.submitting = true;
    syncSubmitButton();

    var items = Object.keys(state.cart).map(function(id){
      var dish = findDish(id);
      return { name: dish.name, price: dish.price, qty: state.cart[id] };
    });
    var order = {
      id: uid(),
      table: state.table.trim(),
      remark: state.remark.trim(),
      items: items,
      total: cartTotal(),
      time: Date.now(),
      status: "new"
    };

    await storageSet("orders:" + order.id, JSON.stringify(order), true);
    notifyTelegramForOrder(order); // fire-and-forget, doesn't block the UI

    // reset + show stamp
    state.cart = {};
    state.table = "";
    state.remark = "";
    state.submitting = false;
    state.drawerOpen = false;
    render();

    var overlay = document.getElementById("stampOverlay");
    if(overlay){
      overlay.classList.add("show");
      setTimeout(function(){ overlay.classList.remove("show"); }, 1600);
    }
  }

  /* ================= ADMIN VIEW ================= */
  var ADMIN_CODE = "0000";
  var pollTimer = null;
  var notifyPermissionAsked = false;

  function renderGate(){
    var wrap = el("div", {class:"gate"});
    var err = null;
    wrap.appendChild(el("div", {class:"brand-seal"}, ["灶"]));
    wrap.appendChild(el("h2", {}, ["后厨接单台"]));
    wrap.appendChild(el("p", {}, ["请输入管理员口令"]));
    var input = el("input", {type:"password", maxlength:"4", inputmode:"numeric", placeholder:"····"});
    var errBox = el("div", {class:"err"}, [""]);
    wrap.appendChild(input);
    wrap.appendChild(el("div", {}, [
      el("button", {onclick: function(){
        if(input.value === ADMIN_CODE){
          state.adminUnlocked = true;
          render();
          startPolling();
        } else {
          errBox.textContent = "口令错误，请重试";
          input.value = "";
        }
      }}, ["进入"])
    ]));
    wrap.appendChild(errBox);
    wrap.appendChild(el("div", {class:"hint"}, ["默认口令 0000（可在代码中修改） · "]));
    wrap.appendChild(el("a", {class:"back-link", onclick:function(){ state.view="customer"; render(); }}, ["返回点餐"]));
    setTimeout(function(){ input.focus(); }, 50);
    return wrap;
  }

  function renderAdmin(){
    var wrap = el("div", {class:"admin-app"});
    var newCount = state.adminOrders.filter(function(o){ return o.status === "new"; }).length;
    var prepCount = state.adminOrders.filter(function(o){ return o.status === "preparing"; }).length;
    var todayTotal = state.adminOrders.reduce(function(s,o){ return s + o.total; }, 0);

    wrap.appendChild(el("div", {class:"admin-top"}, [
      el("div", {}, [
        el("div", {class:"admin-title"}, [el("span",{class:"live-dot"}), "后厨接单台"]),
        el("div", {class:"tg-badge"}, [
          el("span", {class:"tg-dot" + (state.tgConfigured ? "" : " off")}),
          state.tgConfigured ? "Telegram 通知已开启" : "未配置 Telegram 通知"
        ])
      ]),
      el("div", {style:"display:flex; gap:10px; align-items:center;"}, [
        el("div", {class:"settings-btn", onclick:openSettings}, ["⚙️"]),
        el("a", {class:"back-link", onclick:function(){ stopPolling(); state.view="customer"; render(); }}, ["返回点餐 →"])
      ])
    ]));

    if(state.settingsOpen){
      wrap.appendChild(renderSettingsModal());
    }

    wrap.appendChild(el("div", {class:"admin-stats"}, [
      el("div", {class:"stat-card"}, [el("div",{class:"num"},[String(newCount)]), el("div",{class:"lbl"},["新订单"])]),
      el("div", {class:"stat-card"}, [el("div",{class:"num"},[String(prepCount)]), el("div",{class:"lbl"},["制作中"])]),
      el("div", {class:"stat-card"}, [el("div",{class:"num"},["¥"+todayTotal]), el("div",{class:"lbl"},["累计金额"])]),
    ]));

    var ticketsWrap = el("div", {class:"tickets"});
    var sorted = state.adminOrders.slice().sort(function(a,b){ return b.time - a.time; });
    if(sorted.length === 0){
      ticketsWrap.appendChild(el("div", {class:"empty-admin"}, ["暂无订单，等待客人下单中…"]));
    } else {
      sorted.forEach(function(order){
        ticketsWrap.appendChild(renderTicket(order));
      });
    }
    wrap.appendChild(ticketsWrap);

    wrap.appendChild(el("div", {class:"toast", id:"adminToast"}, ["🔔 收到新订单"]));

    return wrap;
  }

  function renderTicket(order){
    var itemsWrap = el("div", {class:"ticket-items"}, order.items.map(function(it){
      return el("div", {class:"row"}, [
        el("span", {class:"n"}, [it.name + " ×" + it.qty]),
        el("span", {}, ["¥" + (it.price*it.qty)])
      ]);
    }));

    var actions = el("div", {class:"ticket-actions"});
    if(order.status === "new"){
      actions.appendChild(el("button", {class:"btn-prep", onclick:function(){ updateOrderStatus(order, "preparing"); }}, ["开始制作"]));
    } else if(order.status === "preparing"){
      actions.appendChild(el("button", {class:"btn-done", onclick:function(){ updateOrderStatus(order, "done"); }}, ["完成出餐"]));
    }

    var badgeClass = "badge-" + order.status;

    return el("div", {class:"ticket status-" + order.status}, [
      el("div", {class:"ticket-head"}, [
        el("div", {}, [
          el("div", {class:"ticket-table"}, [order.table]),
          el("div", {class:"ticket-time"}, [fmtTime(order.time)])
        ]),
        el("div", {class:"ticket-badge " + badgeClass}, [STATUS_LABEL[order.status]])
      ]),
      itemsWrap,
      order.remark ? el("div", {class:"ticket-remark"}, ["备注：" + order.remark]) : null,
      el("div", {class:"ticket-foot"}, [
        el("div", {class:"ticket-total"}, ["¥" + order.total]),
        actions
      ])
    ]);
  }

  async function updateOrderStatus(order, newStatus){
    order.status = newStatus;
    await storageSet("orders:" + order.id, JSON.stringify(order), true);
    render();
  }

  async function fetchOrders(){
    var listResult = await storageList("orders:", true);
    if(!listResult || !listResult.keys) return;
    var keys = listResult.keys;
    var results = await Promise.all(keys.map(function(k){ return storageGet(k, true); }));
    var orders = [];
    var freshNewOrders = [];
    results.forEach(function(r){
      if(!r || !r.value) return;
      try{
        var order = JSON.parse(r.value);
        orders.push(order);
        if(!state.knownOrderIds[order.id]){
          state.knownOrderIds[order.id] = true;
          if(order.status === "new") freshNewOrders.push(order);
        }
      } catch(e){}
    });
    state.adminOrders = orders;

    if(freshNewOrders.length > 0 && state.view === "admin" && state.adminUnlocked){
      notifyNewOrders(freshNewOrders);
    }
    render();
  }

  function notifyNewOrders(orders){
    var toast = document.getElementById("adminToast");
    if(toast){
      var label = orders.length === 1
        ? ("🔔 新订单 · " + orders[0].table)
        : ("🔔 " + orders.length + " 个新订单");
      toast.textContent = label;
      toast.classList.add("show");
      setTimeout(function(){ toast.classList.remove("show"); }, 3000);
    }
    if("Notification" in window){
      if(Notification.permission === "granted"){
        orders.forEach(function(o){
          try{
            new Notification("老灶食堂 · 新订单", {
              body: o.table + " · ¥" + o.total + (o.remark ? " · " + o.remark : ""),
              tag: o.id
            });
          } catch(e){}
        });
      } else if(Notification.permission !== "denied" && !notifyPermissionAsked){
        notifyPermissionAsked = true;
        Notification.requestPermission();
      }
    }
    if(navigator.vibrate){ navigator.vibrate([80,40,80]); }
  }

  function startPolling(){
    fetchOrders();
    refreshTelegramBadge();
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(fetchOrders, 4000);
    if("Notification" in window && Notification.permission === "default" && !notifyPermissionAsked){
      notifyPermissionAsked = true;
      Notification.requestPermission();
    }
  }
  function stopPolling(){
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  }

  async function refreshTelegramBadge(){
    var cfg = await getTelegramConfig();
    state.tgConfigured = !!(cfg.token && cfg.chatId);
    if(state.view === "admin" && state.adminUnlocked) render();
  }

  async function openSettings(){
    var cfg = await getTelegramConfig();
    state.tgToken = cfg.token;
    state.tgChatId = cfg.chatId;
    state.tgStatus = "";
    state.tgStatusType = "";
    state.settingsOpen = true;
    render();
  }

  function renderSettingsModal(){
    var statusEl = el("div", {class:"modal-status " + state.tgStatusType, id:"tgStatus"}, [state.tgStatus]);

    return el("div", {class:"modal-overlay", onclick:function(e){ if(e.target === e.currentTarget){ state.settingsOpen=false; render(); } }}, [
      el("div", {class:"modal-card"}, [
        el("h3", {}, ["🔔 Telegram 自动通知"]),
        el("div", {class:"desc"}, [
          "客人下单后会自动把订单发到你的 Telegram。需要先找 @BotFather 创建一个机器人拿到 Token，再和机器人随便发条消息，用 Token 打开 https://api.telegram.org/bot<TOKEN>/getUpdates 就能看到你的 chat id。"
        ]),
        el("div", {class:"field"}, [
          el("label", {}, ["Bot Token"]),
          el("input", {
            type:"text", placeholder:"123456789:AA...", value: state.tgToken,
            oninput:function(e){ state.tgToken = e.target.value.trim(); }
          })
        ]),
        el("div", {class:"field"}, [
          el("label", {}, ["Chat ID"]),
          el("input", {
            type:"text", placeholder:"例如 123456789 或 -100123456789", value: state.tgChatId,
            oninput:function(e){ state.tgChatId = e.target.value.trim(); }
          })
        ]),
        statusEl,
        el("div", {class:"modal-actions"}, [
          el("button", {class:"modal-test", onclick: testTelegram}, ["发送测试消息"]),
          el("button", {class:"modal-save", onclick: saveAndCloseSettings}, ["保存"])
        ]),
        el("div", {class:"modal-close", onclick:function(){ state.settingsOpen=false; render(); }}, ["取消"])
      ])
    ]);
  }

  function setTgStatus(msg, type){
    state.tgStatus = msg;
    state.tgStatusType = type;
    var el2 = document.getElementById("tgStatus");
    if(el2){ el2.textContent = msg; el2.className = "modal-status " + type; }
  }

  async function testTelegram(){
    if(!state.tgToken || !state.tgChatId){
      setTgStatus("请先填写 Token 和 Chat ID", "err");
      return;
    }
    setTgStatus("发送中…", "");
    await saveTelegramConfig(state.tgToken, state.tgChatId);
    var result = await sendTelegramMessage("✅ 老灶食堂后厨通知测试成功，配置完成！");
    if(result.ok){
      setTgStatus("发送成功，请查看 Telegram", "ok");
    } else if(result.reason === "network"){
      setTgStatus("发送失败：网络请求被拦截或跨域限制", "err");
    } else {
      setTgStatus("发送失败：" + result.reason, "err");
    }
  }

  async function saveAndCloseSettings(){
    await saveTelegramConfig(state.tgToken, state.tgChatId);
    state.tgConfigured = !!(state.tgToken && state.tgChatId);
    state.settingsOpen = false;
    render();
  }

  render();
})();
</script>
</body>
</html>
